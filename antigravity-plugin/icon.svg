<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- DeepSeek Blue Glow -->
    <linearGradient id="dsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="60%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#003bb5"/>
    </linearGradient>

    <!-- Gemini Magic Gradient -->
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7675"/>
      <stop offset="30%" stop-color="#D96570"/>
      <stop offset="70%" stop-color="#9B72CF"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>

    <!-- Bridge Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#9B72CF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#222f3e" stroke-width="4"/>

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="180" r="100" fill="#9B72CF" opacity="0.12" filter="url(#glow)"/>
  <circle cx="350" cy="330" r="110" fill="#0066FF" opacity="0.15" filter="url(#glow)"/>

  <!-- Background Data Tracks / Bridge Orbit -->
  <path d="M 120 330 C 180 390, 330 390, 390 330" fill="none" stroke="#223249" stroke-width="3" stroke-dasharray="6,8" opacity="0.6"/>
  <path d="M 120 180 C 180 120, 330 120, 390 180" fill="none" stroke="#223249" stroke-width="3" stroke-dasharray="6,8" opacity="0.6"/>

  <!-- The Quantum Bridge Arch (Harmonious Dual Arcs) -->
  <path d="M 160 210 C 230 290, 280 290, 350 290" fill="none" stroke="url(#geminiGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85" filter="url(#subtleGlow)"/>
  <path d="M 160 220 C 230 220, 280 220, 350 300" fill="none" stroke="url(#dsBlue)" stroke-width="8" stroke-linecap="round" opacity="0.85" filter="url(#subtleGlow)"/>

  <!-- Center Synapse Pulse -->
  <line x1="160" y1="215" x2="350" y2="295" stroke="url(#beamGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="255" cy="255" r="9" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="255" cy="255" r="4" fill="#00D2FF"/>

  <!-- LEFT SYMBOL: Gemini 4-Point Starburst -->
  <g transform="translate(155, 210) scale(1.15)" filter="url(#subtleGlow)">
    <!-- Star Path -->
    <path d="M 0 -58 Q 0 0 -58 0 Q 0 0 0 58 Q 0 0 58 0 Q 0 0 0 -58 Z" fill="url(#geminiGrad)"/>
    <!-- Core Bright Dot -->
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- RIGHT SYMBOL: DeepSeek Whale Fin / High-Speed Flash Nexus -->
  <g transform="translate(350, 295) scale(1.15)" filter="url(#subtleGlow)">
    <!-- Outer Shield / Tail Contour -->
    <path d="M -38 -15 C -30 -42, 10 -46, 36 -28 C 48 -19, 52 2, 42 22 C 30 46, -15 52, -32 30 C -42 16, -42 -2, -38 -15 Z" fill="none" stroke="url(#dsBlue)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Internal Lightning / Flash Surge -->
    <path d="M 6 -28 L -14 2 L 6 2 L -4 30 L 22 -4 L 4 -4 Z" fill="url(#dsBlue)"/>
    <circle cx="3" cy="-1" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Small Satellite Sparkles -->
  <circle cx="110" cy="140" r="3" fill="#FF7675" opacity="0.8"/>
  <circle cx="395" cy="160" r="3" fill="#00D2FF" opacity="0.8"/>
  <circle cx="410" cy="380" r="4" fill="#0066FF" opacity="0.7"/>
  <circle cx="100" cy="360" r="3.5" fill="#9B72CF" opacity="0.7"/>

  <!-- Bottom Label Pill (Discreet, high-tech) -->
  <g transform="translate(256, 436)">
    <rect x="-86" y="-16" width="172" height="32" rx="16" fill="#141c2b" stroke="#25354d" stroke-width="1.5"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#8da4c4" text-anchor="middle">
      GEMINI × DSH
    </text>
  </g>
</svg>
